name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  STARKNET_DEVNET_VERSION: 0.4.2
  STARKNET_DEVNET_SHA256: 26ae7d7940080eb41bd90ab9781b9f741f2f6d31861da9645556b2894eb95f86

jobs:
  lint-build-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install Starknet Devnet
        run: |
          curl -fsSL -o "$RUNNER_TEMP/devnet.tar.gz" \
            "https://github.com/0xSpaceShard/starknet-devnet/releases/download/v$STARKNET_DEVNET_VERSION/starknet-devnet-x86_64-unknown-linux-gnu.tar.gz"
          echo "$STARKNET_DEVNET_SHA256  $RUNNER_TEMP/devnet.tar.gz" | sha256sum --check
          sudo tar -xzf "$RUNNER_TEMP/devnet.tar.gz" -C /usr/local/bin starknet-devnet
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.7.1
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run lint:unused
      - run: bun run test
      - run: bun run test:integration

  test-offchain:
    name: ${{ matrix.app }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: [hub, sequencer]
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # The mysql driver only supports mysql_native_password.
      - name: Start MySQL
        run: |
          docker run -d --name mysql -p 3306:3306 --tmpfs /var/lib/mysql \
            -e MYSQL_ROOT_PASSWORD=root mysql:8.0 \
            --default-authentication-plugin=mysql_native_password
          timeout 120 sh -c 'until docker exec mysql mysqladmin ping -h127.0.0.1 -uroot -proot --silent; do sleep 1; done'
      - name: Start Redis
        if: matrix.app == 'sequencer'
        run: docker run -d --name redis -p 6379:6379 redis:7
      - run: bun install --frozen-lockfile
      - run: bun run test
        working-directory: apps/${{ matrix.app }}

  e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install unzip
        run: apt-get update && apt-get install -y unzip
      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: PLAYWRIGHT_HTML_OPEN=never bun run test:e2e --reporter=html
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
