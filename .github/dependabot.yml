version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 0
    allow:
      - dependency-name: "@snapshot-labs/*"
    ignore:
      - dependency-name: "@snapshot-labs/checkpoint"
    groups:
      snapshot:
        patterns:
        - "@snapshot-labs/*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    # Merging a change to these workflows triggers a deploy.
    exclude-paths:
      - ".github/workflows/deploy*.yml"
      - ".github/workflows/_deploy-app.yml"
    groups:
      actions:
        patterns:
        - "*"
