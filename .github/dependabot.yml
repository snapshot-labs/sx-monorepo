version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 0
    allow:
      - dependency-name: "@snapshot-labs/*"
    ignore:
      - dependency-name: "@snapshot-labs/checkpoint"
    groups:
      snapshot:
        patterns:
        - "@snapshot-labs/*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    # Updated by hand: a pull request cannot test these workflows, and merging
    # a change to the deploy ones triggers a deploy.
    exclude-paths:
      - ".github/workflows/deploy*.yml"
      - ".github/workflows/_deploy-app.yml"
      - ".github/workflows/_promote-app.yml"
    ignore:
      # v2 renames the inputs release.yml uses and needs Changesets CLI v3.
      - dependency-name: "changesets/action"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns:
        - "*"
